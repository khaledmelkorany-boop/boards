<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محرر PDF</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
:root{--bg:#dfe3ea;--tab:#cdd3dd;--panel:#fff;--seg:#eef1f5;--ink:#0f172a;--mut:#64748b;--line:#e1e5ec;--acc:#1f4fd8;--accb:#e7eeff;--danger:#d92d3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e15;--tab:#06090e;--panel:#131923;--seg:#1c2431;--ink:#e6eaf2;--mut:#8a96a9;--line:#242d3b;--acc:#7da2ff;--accb:#18274a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0e15;--tab:#06090e;--panel:#131923;--seg:#1c2431;--ink:#e6eaf2;--mut:#8a96a9;--line:#242d3b;--acc:#7da2ff;--accb:#18274a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.b{display:flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 11px;border:1px solid transparent;border-radius:8px;background:transparent;font-size:13px;font-weight:500;white-space:nowrap;transition:background .15s}
.b:hover:not(:disabled){background:var(--seg)}
.b:disabled{opacity:.35;cursor:default}
.b.pri{background:var(--acc);color:#fff;font-weight:600}.b.pri:hover:not(:disabled){background:var(--acc);filter:brightness(1.1)}
.b.on{color:var(--acc)}
.b svg,.opt svg,.fx svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
i[data-i]{display:flex}
.g{display:flex;align-items:center;gap:6px;flex:none}
.mut{font-size:12px;color:var(--mut);font-weight:500}
.sep{width:1px;height:24px;background:var(--line);flex:none}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--acc)}
input[type=color]{width:20px;height:20px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer;flex:none}
/* tab bar */
#tabbar{display:flex;align-items:flex-end;gap:12px;height:46px;padding:0 12px;background:var(--tab);flex:none}
.brand{display:flex;align-items:center;gap:9px;height:36px;font-weight:700;font-size:15px;flex:none;padding-inline-end:6px}
.lg{width:26px;height:26px;border-radius:7px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}.lg svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;height:36px;max-width:200px;min-width:110px;padding:0 6px 0 10px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--mut);font-size:13px;font-weight:500;flex:0 1 auto}
.tab:hover{background:rgba(128,140,160,.18)}
.tab.on{background:var(--panel);color:var(--ink);font-weight:600;cursor:default}
.ti{font-size:9px;font-weight:700;color:#fff;background:var(--danger);border-radius:4px;padding:2px 4px;flex:none}.ti.bd{background:#15803d}
.tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
.md{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.x{border:0;background:none;color:var(--mut);min-width:24px;height:24px;border-radius:6px;font-size:12px;flex:none}
.x:hover{background:rgba(128,140,160,.28);color:var(--danger)}.x.arm{background:var(--danger);color:#fff;padding:0 8px;font-size:11px}
#acts{display:flex;align-items:center;gap:4px;height:36px;flex:none}
#acts .b{color:var(--ink)}#acts .b:hover:not(:disabled){background:rgba(128,140,160,.22)}#acts .b.pri{color:#fff}
#cnt{margin-inline-start:auto;height:36px;display:flex;align-items:center;flex:none}
/* command bar */
#cmd{display:flex;align-items:center;gap:14px;height:54px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none;position:relative;z-index:6}
#tools{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--seg)}
#tools .b{height:32px;padding:0 12px}
#tools .b.on{background:var(--panel);color:var(--acc);box-shadow:0 1px 3px rgba(15,23,42,.18)}
#props{display:flex;align-items:center;gap:14px}
#cols,#szg{display:flex;align-items:center;gap:6px}
#cols::before{content:"اللون";font-size:12px;font-weight:500;color:var(--mut);margin-inline-end:4px}
#szg::before{content:"الحجم";font-size:12px;font-weight:500;color:var(--mut)}
#sz{width:96px;accent-color:var(--acc)}
#szv{min-width:24px;text-align:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
#dot{--d:8px;width:var(--d);height:var(--d);border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--line)}
#bo{display:none;align-items:center;gap:6px}#bo .b{height:30px;padding:0 10px;background:var(--seg)}#bo .b.on{background:var(--accb);color:var(--acc);border-color:var(--acc)}
.ur{display:flex;gap:2px;margin-inline-start:auto;flex:none}
/* workspace */
#work{flex:1;display:flex;min-height:0;position:relative}
#th{width:136px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;position:relative}
#th.none,.nothumbs #th{display:none}
.th{display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px 5px 4px;border:1px solid transparent;border-radius:8px;background:none;font-size:11px;font-weight:600;color:var(--mut);flex:none}
.th canvas{width:100%;height:auto;background:#fff;border-radius:2px;box-shadow:0 0 0 1px var(--line)}
.th:hover{background:var(--seg)}.th.on{background:var(--accb);border-color:var(--acc);color:var(--acc)}
#stage{flex:1;position:relative;min-width:0}
#viewer{position:absolute;inset:0;overflow:auto;direction:ltr}
#pages{direction:ltr;display:flex;flex-direction:column;align-items:center;min-width:max-content;padding:28px 24px 96px}
.pg{position:relative;flex:none;background:#fff;margin-bottom:24px;border-radius:2px;box-shadow:0 1px 2px rgba(15,23,42,.22),0 10px 30px rgba(15,23,42,.16)}
.pg canvas,.tx{position:absolute;inset:0;width:100%;height:100%}
.ink{mix-blend-mode:multiply}.pg.board .ink{mix-blend-mode:normal}.tx{pointer-events:none;overflow:hidden}
[data-tool=pen] .ink,[data-tool=hl] .ink,[data-tool=eraser] .ink{touch-action:none;cursor:crosshair}[data-tool=text] .ink{cursor:text}[data-tool=hand] .ink{cursor:grab}
.t{position:absolute;white-space:pre-wrap;line-height:1.35;outline:none;direction:rtl;padding:0 2px;min-width:12px;color:#000;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
[data-tool=text] .t{pointer-events:auto;cursor:text}.t:hover{outline:1px dashed var(--acc)}
.t[contenteditable=true]{outline:1.5px solid var(--acc);background:rgba(255,255,255,.8)}.board .t[contenteditable=true]{background:rgba(128,128,128,.35)}
#ring{position:fixed;border:1.5px solid var(--acc);border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%);z-index:5;background:rgba(31,79,216,.08)}
/* floating status */
#status{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:6px;padding:5px 8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(15,23,42,.22);z-index:5;direction:rtl}
body.has #status{display:flex}
#status .b{height:30px;padding:0 8px}
#pn{width:42px;height:28px;text-align:center;border:1px solid var(--line);border-radius:7px;background:var(--seg);color:var(--ink);font:inherit;font-size:13px;font-weight:600}
#pt::before{content:"من ";}
#zv{min-width:46px;text-align:center;font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
/* empty */
#empty{position:absolute;inset:0;display:flex;padding:24px;overflow:auto}
.start{margin:auto;width:100%;max-width:620px;text-align:center}
.start h2{margin:0 0 8px;font-size:26px;font-weight:700}
.start>p{margin:0 0 28px;color:var(--mut);font-size:14px;line-height:1.9}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:20px;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:var(--acc);box-shadow:0 6px 22px rgba(31,79,216,.14)}
.opt .ic{width:42px;height:42px;border-radius:11px;background:var(--accb);color:var(--acc);display:flex;align-items:center;justify-content:center;margin-bottom:8px}.opt .ic svg{width:22px;height:22px}
.opt b{font-size:16px}.opt small{font-size:12.5px;color:var(--mut);line-height:1.7}
.fx-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:26px}
.fx{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);padding:5px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}.fx svg{width:15px;height:15px}
kbd{font:inherit;font-size:10.5px;font-weight:600;min-width:20px;text-align:center;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--seg);color:var(--ink)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:30}#toast.show{opacity:1;transform:translateX(-50%)}
#drop{position:absolute;inset:10px;border:3px dashed var(--acc);border-radius:18px;background:var(--accb);opacity:.92;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--acc);z-index:20}
@media(max-width:1000px){.b .l{display:none}}
@media(max-width:720px){#th,#tgl,#cnt,.brand span:last-child{display:none}.opts{grid-template-columns:1fr}.tab{min-width:96px}#cmd{gap:10px;padding:0 10px}#pages{padding:16px 10px 90px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="tabbar"><div class="brand"><span class="lg"><svg viewBox="0 0 24 24"><path d="M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span><span>محرر PDF</span></div>
 <div id="tabs"></div><div id="acts"><button class="b pri" id="open" title="فتح ملف PDF"><i data-i="open"></i><span class="l">فتح PDF</span></button><button class="b" id="board" title="سبورة جديدة"><i data-i="board"></i><span class="l">سبورة</span></button></div><span class="mut" id="cnt"></span>
 <input type="file" id="fi" accept="application/pdf,.pdf" multiple hidden></header>
<div id="cmd"><button class="b" id="tgl" title="لوحة الصفحات" aria-label="لوحة الصفحات"><i data-i="panel"></i></button><div class="sep"></div>
 <div id="tools"></div><div class="sep"></div>
 <div id="props"><div id="cols"></div><div id="szg"><input type="range" id="sz" aria-label="الحجم"><span id="szv"></span><i id="dot"></i></div></div>
 <div id="bo"><span class="mut">الخلفية</span><button class="b" data-p="grid">مربعات</button><button class="b" data-p="plain">سادة</button><button class="b" data-p="lines">خطوط</button><span class="mut" style="margin-inline-start:6px">اللون</span><button class="sw" data-bg="#ffffff" style="background:#fff" title="أبيض"></button><button class="sw" data-bg="#14532d" style="background:#14532d" title="أخضر غامق"></button><button class="sw" data-bg="#0b0b0b" style="background:#0b0b0b" title="أسود"></button></div><span id="bs" hidden></span>
 <div class="ur"><button class="b" id="undo" title="رجوع (Ctrl+Z)"><i data-i="undo"></i><span class="l">رجوع</span></button><button class="b" id="redo" title="إعادة (Ctrl+Y)"><i data-i="redo"></i><span class="l">إعادة</span></button></div></div>
<main id="work"><aside id="th" class="none" aria-label="الصفحات"></aside>
 <div id="stage"><div id="viewer"><div id="pages"></div></div>
  <div id="empty"><div class="start"><h2>ابدأ شغلك</h2><p>افتح ملف PDF عشان تكتب عليه وتظلل وترسم، أو ابدأ بسبورة فاضية. تقدر تفتح لحد 5 ملفات في نفس الوقت.</p>
   <div class="opts"><button class="opt" id="open2"><span class="ic"><i data-i="open"></i></span><b>فتح ملف PDF</b><small>اختار ملف من جهازك أو اسحبه وأفلته في أي مكان في الصفحة.</small></button><button class="opt" id="board2"><span class="ic"><i data-i="board"></i></span><b>سبورة جديدة</b><small>مساحة فاضية بخلفية مربعات أو خطوط للكتابة والرسم.</small></button></div>
   <div class="fx-row"><span class="fx"><i data-i="text"></i>كتابة <kbd>T</kbd></span><span class="fx"><i data-i="pen"></i>قلم <kbd>P</kbd></span><span class="fx"><i data-i="hl"></i>هايلايت <kbd>H</kbd></span><span class="fx"><i data-i="eraser"></i>ممحاة <kbd>E</kbd></span><span class="fx"><i data-i="undo"></i>رجوع <kbd>Ctrl Z</kbd></span></div></div></div>
  <div id="status"><button class="b" id="pp" title="الصفحة السابقة" aria-label="الصفحة السابقة"><i data-i="up"></i></button><input id="pn" type="number" min="1" aria-label="رقم الصفحة"><span class="mut" id="pt"></span><button class="b" id="pnx" title="الصفحة التالية" aria-label="الصفحة التالية"><i data-i="down"></i></button><div class="sep"></div><button class="b" id="zo" title="تصغير" aria-label="تصغير"><i data-i="minus"></i></button><span id="zv"></span><button class="b" id="zi" title="تكبير" aria-label="تكبير"><i data-i="plus"></i></button><button class="b" id="zf" title="ملاءمة العرض" aria-label="ملاءمة العرض"><i data-i="fit"></i></button></div></div>
 <div id="drop">أفلت ملف PDF هنا</div></main>
<div id="ring"></div><div id="toast" role="status"></div>
<script>
const MAX=5,ICONS={open:'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',board:'M3 4h18v12H3z M8 20l4-4 4 4',hand:'M8 13V5a1.5 1.5 0 0 1 3 0v6 M11 10V4a1.5 1.5 0 0 1 3 0v7 M14 6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-3-5a1.5 1.5 0 0 1 2.5-1.5L8 14',text:'M5 6V4h14v2 M12 4v16 M9 20h6',pen:'M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',hl:'M9 11l-6 6v3h9l3-3 M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4',eraser:'M20 20H9l-5.3-5.3a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L12 20 M7 11l6 6',undo:'M9 14L4 9l5-5 M4 9h10.5a5.5 5.5 0 0 1 0 11H11',redo:'M15 14l5-5-5-5 M20 9H9.5a5.5 5.5 0 0 0 0 11H13',plus:'M12 5v14 M5 12h14',minus:'M5 12h14',fit:'M4 9V5h4 M20 9V5h-4 M4 15v4h4 M20 15v4h-4',up:'M6 15l6-6 6 6',down:'M6 9l6 6 6-6',panel:'M3 5h18v14H3z M9 5v14'};
const svg=n=>`<svg viewBox="0 0 24 24"><path d="${ICONS[n]}"/></svg>`;
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=svg(e.dataset.i));
const $=id=>document.getElementById(id),pagesEl=$('pages'),viewer=$('viewer');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const docs=[];let cur=null,tool='hl',drag=null,uid=0;
const sizes={text:18,pen:3,hl:18,eraser:24},rng={text:[8,96],pen:[1,24],hl:[6,60],eraser:[8,90]};
const colors={text:'#111827',pen:'#e11d48',hl:'#ffe14d'};
const PAL=['#111827','#ffffff','#e11d48','#2563eb','#16a34a','#f59e0b','#ffe14d','#a855f7','#ff7ab6','#22d3ee'];
const KS={hand:'V',text:'T',pen:'P',hl:'H',eraser:'E'};const TL=[['hand','تحريك'],['text','نص'],['pen','قلم'],['hl','هايلايت'],['eraser','ممحاة']];
$('tools').innerHTML=TL.map(([k,l])=>`<button class="b" data-t="${k}" title="${l} (${KS[k]})">${svg(k)}<span class="l">${l}</span></button>`).join('');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
function drawCols(){const c=colors[tool];if(tool in sizes)szLbl();$('cols').innerHTML=PAL.map(p=>`<button class="sw${p===c?' on':''}" data-c="${p}" style="background:${p}"></button>`).join('')+'<input type="color" id="cc" value="'+(c||'#000000')+'">';$('cc').oninput=e=>{colors[tool]=e.target.value;drawCols()}}
$('cols').onclick=e=>{const b=e.target.closest('[data-c]');if(b){colors[tool]=b.dataset.c;drawCols()}};
function setTool(t){tool=t;pagesEl.dataset.tool=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 const hasC=t in colors,hasS=t in sizes;$('props').style.display=(hasC||hasS)?'flex':'none';$('cols').style.display=hasC?'':'none';
 $('szg').style.display=hasS?'flex':'none';if(hasS){$('sz').min=rng[t][0];$('sz').max=rng[t][1];$('sz').value=sizes[t];szLbl()}
 if(hasC)drawCols();$('ring').style.display='none'}
const szLbl=()=>{$('szv').textContent=sizes[tool];const d=$('dot');d.style.setProperty('--d',Math.min(22,Math.max(4,sizes[tool]*(tool==='text'?.55:1)))+'px');d.style.background=colors[tool]||'var(--ink)'};
$('sz').oninput=e=>{sizes[tool]=+e.target.value;szLbl()};
$('tools').onclick=e=>{const b=e.target.closest('[data-t]');if(b)setTool(b.dataset.t)};
/* files */
const pickFile=()=>$('fi').click();['open','open2'].forEach(i=>$(i).onclick=pickFile);['board','board2'].forEach(i=>$(i).onclick=openBoard);
$('fi').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
async function addFiles(fs){for(const f of fs){if(!/pdf$/i.test(f.type||f.name)){toast('الملف ده مش PDF');continue}
 if(docs.filter(d=>d.kind==='pdf').length>=MAX){toast('الحد الأقصى '+MAX+' ملفات مفتوحة');break}
 try{toast('جارِ فتح الملف…');const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  const pages=await Promise.all(Array.from({length:pdf.numPages},async(_,i)=>{const p=await pdf.getPage(i+1),v=p.getViewport({scale:1});return{p,w:v.width,h:v.height}}));
  addDoc({kind:'pdf',name:f.name,pages})}catch(err){toast('تعذّر فتح الملف (ممكن يكون محمي بباسورد)')}}}
function addDoc(d){Object.assign(d,{id:++uid,ann:d.pages.map(()=>[]),undo:[],redo:[],zoom:null,scroll:0,page:1});docs.push(d);show(d)}
function openBoard(){let d=docs.find(x=>x.kind==='board');if(d)show(d);else addDoc({kind:'board',name:'السبورة',pages:[{w:1600,h:1000}],bg:'#ffffff',pat:'grid'});setTool(tool==='hand'||tool==='text'?'pen':tool)}
/* viewer */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.target._z!==cur.zoom)render(e.target)}),{root:viewer,rootMargin:'700px 0px'});
function show(d){if(cur)cur.scroll=viewer.scrollTop;cur=d;io.disconnect();pagesEl.innerHTML='';$('empty').style.display='none';
 if(!d.zoom)d.zoom=Math.min(2.2,Math.max(.4,(viewer.clientWidth-44)/d.pages[0].w));
 d.pages.forEach((pg,i)=>{const w=document.createElement('div');w.className='pg'+(d.kind==='board'?' board':'');w.dataset.i=i;w.innerHTML='<canvas class="bg"></canvas><canvas class="ink"></canvas><div class="tx"></div>';pagesEl.append(w)});
 sizeAll();viewer.scrollTop=d.scroll;[...pagesEl.children].forEach((w,i)=>{io.observe(w);redraw(i)});buildThumbs(d);sync()}
function sizeAll(){[...pagesEl.children].forEach((w,i)=>{w.style.width=cur.pages[i].w*cur.zoom+'px';w.style.height=cur.pages[i].h*cur.zoom+'px'})}
async function render(w){const i=+w.dataset.i,d=cur,pg=d.pages[i],z=d.zoom,dpr=Math.min(devicePixelRatio||1,2),c=w.querySelector('.bg');w._z=z;
 if(w._t){try{w._t.cancel()}catch(e){}}c.width=Math.round(pg.w*z*dpr);c.height=Math.round(pg.h*z*dpr);const x=c.getContext('2d');
 if(d.kind==='board'){const bg=d.bg||'#ffffff',s=40*z*dpr;x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);x.strokeStyle=bg==='#ffffff'?'rgba(70,90,130,.22)':'rgba(255,255,255,.17)';x.lineWidth=Math.max(1,dpr);x.beginPath();
 if(d.pat==='grid')for(let a=s;a<c.width;a+=s){x.moveTo(a,0);x.lineTo(a,c.height)}
 if(d.pat!=='plain')for(let b=s;b<c.height;b+=s){x.moveTo(0,b);x.lineTo(c.width,b)}
 x.stroke();return}
 const t=pg.p.render({canvasContext:x,viewport:pg.p.getViewport({scale:z*dpr})});w._t=t;try{await t.promise}catch(e){}}
function redraw(i){const w=pagesEl.children[i];if(!w)return;const pg=cur.pages[i],z=cur.zoom,dpr=Math.min(devicePixelRatio||1,2),c=w.querySelector('.ink'),W=Math.round(pg.w*z*dpr),H=Math.round(pg.h*z*dpr);
 if(c.width!==W||c.height!==H){c.width=W;c.height=H}const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);x.setTransform(z*dpr,0,0,z*dpr,0,0);x.lineJoin='round';
 const tx=w.querySelector('.tx');tx.innerHTML='';
 for(const s of cur.ann[i]){if(s.t==='x'){const e=document.createElement('div');e.className='t';e.dir='auto';e.textContent=s.v;e._it=s;Object.assign(e.style,{left:s.x*z+'px',top:s.y*z+'px',fontSize:s.s*z+'px',color:s.c});tx.append(e);continue}
  const p=s.pts;x.beginPath();x.lineCap=s.k==='hl'?'butt':'round';x.globalAlpha=s.k==='hl'?.5:1;x.strokeStyle=s.c;x.lineWidth=s.w;x.moveTo(p[0][0],p[0][1]);
  for(let j=1;j<p.length-1;j++)x.quadraticCurveTo(p[j][0],p[j][1],(p[j][0]+p[j+1][0])/2,(p[j][1]+p[j+1][1])/2);x.lineTo(p[p.length-1][0],p[p.length-1][1]);x.stroke()}x.globalAlpha=1}
const redrawAll=()=>cur.pages.forEach((_,i)=>redraw(i));
const snap=()=>JSON.stringify(cur.ann);
function pushH(b){cur.undo.push(b);if(cur.undo.length>80)cur.undo.shift();cur.redo=[];sync()}
function undo(){if(!cur)return;if(!cur.undo.length)return toast('مفيش تعديلات للرجوع عنها');cur.redo.push(snap());cur.ann=JSON.parse(cur.undo.pop());redrawAll();sync()}
function redo(){if(!cur||!cur.redo.length)return;cur.undo.push(snap());cur.ann=JSON.parse(cur.redo.pop());redrawAll();sync()}
$('undo').onclick=undo;$('redo').onclick=redo;
/* drawing */
const pt=(e,w)=>{const r=w.getBoundingClientRect();return[(e.clientX-r.left)/cur.zoom,(e.clientY-r.top)/cur.zoom]};
function dseg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((px-a[0])*dx+(py-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
function erase(x,y){const r=sizes.eraser/2,i=drag.i,a=cur.ann[i],els=[...drag.w.querySelectorAll('.t')],z=cur.zoom,n=a.length;
 cur.ann[i]=a.filter(s=>{if(s.t==='x'){const e=els.find(q=>q._it===s);if(!e)return true;const l=e.offsetLeft/z,t=e.offsetTop/z;return!(x>l-r&&x<l+e.offsetWidth/z+r&&y>t-r&&y<t+e.offsetHeight/z+r)}
  const p=s.pts,R=r+s.w/2;if(p.length===1)return Math.hypot(x-p[0][0],y-p[0][1])>R;for(let j=1;j<p.length;j++)if(dseg(x,y,p[j-1],p[j])<=R)return false;return true});
 if(cur.ann[i].length!==n){drag.changed=true;redraw(i)}}
pagesEl.addEventListener('pointerdown',e=>{const c=e.target.closest('.ink');if(!c||!['pen','hl','eraser'].includes(tool)||e.button>0)return;const w=c.parentNode,i=+w.dataset.i,[x,y]=pt(e,w);
 drag={i,w,before:snap(),changed:false,last:[x,y]};c.setPointerCapture(e.pointerId);e.preventDefault();
 if(tool==='eraser')erase(x,y);else{drag.s={t:'s',k:tool,c:colors[tool],w:sizes[tool],pts:[[x,y]]};cur.ann[i].push(drag.s);drag.changed=true;redraw(i)}});
pagesEl.addEventListener('pointermove',e=>{if(!drag)return;const[x,y]=pt(e,drag.w);
 if(tool==='eraser'){const[a,b]=drag.last,n=Math.ceil(Math.hypot(x-a,y-b)/(sizes.eraser/4))||1;for(let k=1;k<=n;k++)erase(a+(x-a)*k/n,b+(y-b)*k/n);drag.last=[x,y]}
 else{drag.s.pts.push([x,y]);cancelAnimationFrame(drag.f);drag.f=requestAnimationFrame(()=>redraw(drag.i))}});
const endDrag=()=>{if(!drag)return;if(drag.s&&drag.s.pts.length===1)drag.s.pts.push([drag.s.pts[0][0]+.01,drag.s.pts[0][1]]);if(drag.s)redraw(drag.i);if(drag.changed)pushH(drag.before);drag=null};
pagesEl.addEventListener('pointerup',endDrag);pagesEl.addEventListener('pointercancel',endDrag);
/* text */
function edit(i,el,item,x,y){const before=snap();el.contentEditable='true';el.focus();const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);
 el.onkeydown=e=>{if(e.key==='Escape')el.blur()};
 el.onblur=()=>{el.onblur=null;const v=el.innerText.trim(),a=cur.ann[i];
  if(item){if(v!==item.v){pushH(before);if(v)item.v=v;else a.splice(a.indexOf(item),1)}}else if(v){pushH(before);a.push({t:'x',x,y,s:sizes.text,c:colors.text,v})}
  redraw(i);sync()}}
pagesEl.addEventListener('click',e=>{if(tool!=='text')return;const t=e.target.closest('.t');
 if(t){if(!t.isContentEditable)edit(+t.closest('.pg').dataset.i,t,t._it);return}
 const c=e.target.closest('.ink');if(!c)return;const w=c.parentNode,[x,y]=pt(e,w),el=document.createElement('div');el.className='t';el.dir='auto';
 Object.assign(el.style,{left:x*cur.zoom+'px',top:y*cur.zoom+'px',fontSize:sizes.text*cur.zoom+'px',color:colors.text});w.querySelector('.tx').append(el);edit(+w.dataset.i,el,null,x,y)});
/* hand + ring + scroll */
let pan=null;viewer.addEventListener('pointerdown',e=>{if(tool==='hand'&&e.target.closest('.ink')&&e.pointerType==='mouse')pan={x:e.clientX,y:e.clientY,l:viewer.scrollLeft,t:viewer.scrollTop}});
addEventListener('pointermove',e=>{if(pan){viewer.scrollLeft=pan.l-(e.clientX-pan.x);viewer.scrollTop=pan.t-(e.clientY-pan.y)}
 const r=$('ring'),ok=cur&&['pen','hl','eraser'].includes(tool)&&e.target.closest&&e.target.closest('.ink');if(!ok){r.style.display='none';return}
 const d=Math.max(6,(tool==='eraser'?sizes.eraser:sizes[tool])*cur.zoom);Object.assign(r.style,{display:'block',width:d+'px',height:d+'px',left:e.clientX+'px',top:e.clientY+'px'})});
addEventListener('pointerup',()=>pan=null);
let raf;viewer.addEventListener('scroll',()=>{if(!cur)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{cur.scroll=viewer.scrollTop;const m=viewer.scrollTop+viewer.clientHeight*.35;let p=1;[...pagesEl.children].forEach((w,i)=>{if(w.offsetTop<=m)p=i+1});if(p!==cur.page){cur.page=p;sync(true)}})});
function zoom(f){if(!cur)return;const ratio=viewer.scrollTop/(viewer.scrollHeight||1);cur.zoom=Math.max(.3,Math.min(4,cur.zoom*f));sizeAll();redrawAll();[...pagesEl.children].forEach(w=>{io.unobserve(w);io.observe(w)});viewer.scrollTop=ratio*viewer.scrollHeight;sync(true)}
$('zi').onclick=()=>zoom(1.2);$('zo').onclick=()=>zoom(1/1.2);
viewer.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1)}},{passive:false});
$('pn').onchange=e=>goPage(+e.target.value||1);
/* sync UI */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sync(light){const has=!!cur,pdf=has&&cur.kind==='pdf',bd=has&&cur.kind==='board';document.body.classList.toggle('has',has);
 $('undo').disabled=!has||!cur.undo.length;$('redo').disabled=!has||!cur.redo.length;
 $('zv').textContent=has?Math.round(cur.zoom*100)+'%':'';$('pn').value=has?cur.page:'';$('pt').textContent=has?cur.pages.length:'';$('pn').disabled=!has;
 $('bo').style.display=bd?'flex':'none';$('bs').style.display=bd?'':'none';
 document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',bd&&b.dataset.p===cur.pat));document.querySelectorAll('[data-bg]').forEach(b=>b.classList.toggle('on',bd&&b.dataset.bg===cur.bg));
 $('empty').style.display=has?'none':'flex';$('th').classList.toggle('none',!pdf);$('tgl').disabled=!pdf;
 if(pdf){const t=$('th');t.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',+b.dataset.n===cur.page));const a=t.querySelector('.th.on');if(a&&(a.offsetTop<t.scrollTop||a.offsetTop+a.offsetHeight>t.scrollTop+t.clientHeight))t.scrollTop=a.offsetTop-40}
 if(light===true&&has)return;tabs()}
function tabs(){const n=docs.filter(d=>d.kind==='pdf').length;$('cnt').textContent=n+' من '+MAX+' ملفات';
 $('tabs').innerHTML=docs.map(d=>`<div class="tab${d===cur?' on':''}" data-id="${d.id}" title="${esc(d.name)}"><span class="ti${d.kind==='board'?' bd':''}">${d.kind==='board'?'SBR':'PDF'}</span><span class="tn">${esc(d.name)}</span>${d.ann.flat().length?'<i class="md" title="فيه تعديلات"></i>':''}<button class="x" data-x="${d.id}" title="إغلاق" aria-label="إغلاق">✕</button></div>`).join('')}
$('tabs').onclick=e=>{const x=e.target.closest('[data-x]');
 if(x){const d=docs.find(q=>q.id==x.dataset.x);if(d.ann.flat().length&&!d._arm){d._arm=1;x.classList.add('arm');x.textContent='تأكيد؟';setTimeout(()=>{d._arm=0;tabs()},2500);return}
  docs.splice(docs.indexOf(d),1);if(d===cur){cur=null;pagesEl.innerHTML='';$('th').innerHTML='';io.disconnect();docs.length?show(docs[docs.length-1]):sync()}else sync();return}
 const f=e.target.closest('[data-id]');if(f){const d=docs.find(q=>q.id==f.dataset.id);if(d!==cur)show(d)}};
/* thumbnails + page nav */
const tio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target._r){e.target._r=1;const pg=cur.pages[+e.target.dataset.n-1],c=e.target.querySelector('canvas'),s=c.width/pg.w;pg.p.render({canvasContext:c.getContext('2d'),viewport:pg.p.getViewport({scale:s})}).promise.catch(()=>{})}}),{root:$('th'),rootMargin:'240px'});
function buildThumbs(d){const t=$('th');tio.disconnect();t.scrollTop=0;if(d.kind!=='pdf'){t.innerHTML='';return}
 t.innerHTML=d.pages.map((p,i)=>`<button class="th" data-n="${i+1}"><canvas width="144" height="${Math.round(144*p.h/p.w)}"></canvas><span>${i+1}</span></button>`).join('');t.querySelectorAll('.th').forEach(b=>tio.observe(b))}
const goPage=p=>{if(!cur)return;p=Math.max(1,Math.min(cur.pages.length,p));viewer.scrollTop=pagesEl.children[p-1].offsetTop-14};
$('th').onclick=e=>{const b=e.target.closest('.th');if(b)goPage(+b.dataset.n)};
$('pp').onclick=()=>cur&&goPage(cur.page-1);$('pnx').onclick=()=>cur&&goPage(cur.page+1);
$('tgl').onclick=e=>{$('work').classList.toggle('nothumbs');e.currentTarget.classList.toggle('on')};
$('zf').onclick=()=>cur&&zoom(Math.min(2.2,Math.max(.4,(viewer.clientWidth-44)/cur.pages[0].w))/cur.zoom);
$('bo').onclick=e=>{if(!cur||cur.kind!=='board')return;const p=e.target.closest('[data-p]'),c=e.target.closest('[data-bg]');if(p)cur.pat=p.dataset.p;if(c){cur.bg=c.dataset.bg;const dk=cur.bg!=='#ffffff';['pen','text'].forEach(k=>{if(dk&&colors[k]==='#111827')colors[k]='#ffffff';if(!dk&&colors[k]==='#ffffff')colors[k]='#111827'});if(colors[tool])drawCols()};[...pagesEl.children].forEach(w=>{w._z=0;io.unobserve(w);io.observe(w)});sync()};
/* drop + keys */
let dc=0;addEventListener('dragenter',e=>{e.preventDefault();dc++;$('drop').style.display='flex'});addEventListener('dragleave',()=>{if(--dc<=0){dc=0;$('drop').style.display='none'}});addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;$('drop').style.display='none';addFiles([...e.dataTransfer.files])});
addEventListener('keydown',e=>{if(e.target.isContentEditable||/INPUT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo()}else if(!e.ctrlKey&&!e.metaKey&&!e.altKey){const t=Object.keys(KS).find(q=>KS[q].toLowerCase()===k);if(t)setTool(t)}});
setTool('hl');sync();
